<!DOCTYPE html>
<html>

<head>
    <title>Demonic Avocado</title>

    <style>

        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        #error {
            color: red;
        }


        .anime-images {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 30px;
}

.anime-images img {
    width: 150px;
    height: 150px;
    object-fit: cover;
}
    </style>
</head>

<body>

    <h1>Demonic Avocado</h1>

    <p>
        Sort, stack, and organize household objects into just the right spot
        in <b>____________________</b>, a tidy puzzle game with a mischievous cat who
        likes to shake things up!
    </p>


    
<div class="anime-images">

    <img src="images/killua.jpg" alt="Anime character">
    <img src="images/william.jpg" alt="Anime character">
    <img src="images/uryu1.jpg" alt="Anime character">
    <img src="images/uryu2.jpg" alt="Anime character">
    <img src="images/nobara.jpg" alt="Anime character">
    <img src="images/hatake.jpg" alt="Anime character">

</div>

    <p>Enter the password:</p>

    <input id="password" type="text">

    <button onclick="checkPassword()">Enter</button>

    <p id="error"></p>


    <script>

        function checkPassword() {

            let password = document.getElementById("password").value;

            if (password.toLowerCase() === atob("Y3V0ZSBjYXQ=")) {
            
                document.body.innerHTML = `
                    <h1>Stage 3</h1>
            
                    <p>
                        Red is my color.<br>
                        I head straight to my objective, to my prey,<br>
                        before becoming myself the prey because of a big yellow dot.
                    </p>
            
                    <input id="riddleAnswer" type="text">
            
                    <button onclick="checkRiddle()">Submit</button>
            
                    <p id="riddleError"></p>
                `;

            }
             else {

                document.getElementById("error").textContent =
                    "Incorrect password.";

            }

        }

        function checkRiddle() {

    let answer = document.getElementById("riddleAnswer").value;

    if (answer.toLowerCase() === atob("Ymxpbmt5")) {

        document.body.innerHTML = `
            <h1>Congratulations!!</h1>
        `;
            <a href="downloads/piano.zip" download> <button>Download My Game</button> </a>

    } else {

        document.getElementById("riddleError").textContent =
            "Incorrect.";

    }

}


    </script>

</body>

</html>
